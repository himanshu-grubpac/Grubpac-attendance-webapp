AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Grubpac Attendance API (Express on Lambda + HTTP API)

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: nodejs20.x
    Architectures:
      - x86_64

Parameters:
  MongoDbUri:
    Type: String
    NoEcho: true
    Description: MongoDB Atlas connection string
  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret (32+ characters)
  JwtExpiresIn:
    Type: String
    Default: 12h
    Description: JWT access-token lifetime (jsonwebtoken format, e.g. 12h, 30m) — keep in sync with JwtCookieMaxAgeMs so the cookie and token expire together
  JwtCookieMaxAgeMs:
    Type: String
    Default: '43200000'
    Description: Auth cookie lifetime in ms — keep equal to JwtExpiresIn (12h) so the cookie and token expire together
  ClientOrigin:
    Type: String
    Default: https://localhost
    Description: Frontend origin for CORS (CloudFront URL later)
  ApiFunctionName:
    Type: String
    Default: grubpac-attendance-api
    Description: Lambda function name (use grubpac-attendance-api-staging for staging)
  HelpUploadsBucketName:
    Type: String
    Description: Existing S3 bucket for help ticket attachments (created outside SAM)
  ReservedConcurrency:
    Type: Number
    Default: 40
    MinValue: 0
    MaxValue: 100
    Description: Max concurrent Lambda containers (0 = disabled). Prod 50-60 employees ~40. Staging use 0. If deploy fails on unreserved minimum, set 0 until AWS raises account concurrency limit.
  EnableWarmupSchedule:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: EventBridge ping every 5 min to keep containers warm
  JobFunctionName:
    Type: String
    Default: grubpac-attendance-api-jobs
    Description: Lambda function name for scheduled background jobs (auto-checkout, leave notify)
  # Outbound notifications (leave decision emails/SMS). The deferred
  # leave-decision-notify job needs the same mail/SMS config as the API.
  # IMPORTANT: SAM owns the whole Environment block — any value currently set
  # only in the Lambda console will be reset to the parameter below on the next
  # deploy. Copy working console values into samconfig overrides BEFORE deploying.
  SmtpHost:
    Type: String
    Default: ''
    Description: SMTP host for transactional email (empty disables email)
  SmtpPort:
    Type: String
    Default: '587'
    Description: SMTP port
  SmtpSecure:
    Type: String
    Default: 'false'
    Description: Use implicit TLS for SMTP ('true' for port 465)
  SmtpUser:
    Type: String
    Default: ''
    Description: SMTP username
  SmtpPass:
    Type: String
    NoEcho: true
    Default: ''
    Description: SMTP password
  EmailFrom:
    Type: String
    Default: ''
    Description: From address for transactional email
  EmailFromName:
    Type: String
    Default: Grubpac Attendance
    Description: From name for transactional email
  BrevoApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Brevo API key for transactional SMS (empty disables SMS)
  SmsSender:
    Type: String
    Default: GRUBPAC
    Description: Sender ID for outgoing SMS
  SmsDefaultCountryCode:
    Type: String
    Default: '91'
    Description: Country code prepended to local phone numbers lacking one
  LeaveDecisionUndoMs:
    Type: String
    Default: '15000'
    Description: Undo window (ms) before a leave decision is finalized and mailed
  # Auto-checkout tuning. Consumed when the office-settings doc is first created
  # (thereafter the DB doc wins). Wired into both functions so a fresh staging
  # DB seeds with the intended schedule.
  AutoCheckoutEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Master toggle for the auto-checkout job
  AutoCheckoutOfficeDay:
    Type: String
    Default: same
    AllowedValues:
      - same
      - next
    Description: Which day office auto-checkout lands on (same/next calendar day)
  AutoCheckoutOfficeTime:
    Type: String
    Default: '23:59'
    Description: Office auto-checkout time (IST HH:mm)
  AutoCheckoutWfhDay:
    Type: String
    Default: next
    AllowedValues:
      - same
      - next
    Description: Which day WFH auto-checkout lands on (same/next calendar day)
  AutoCheckoutWfhTime:
    Type: String
    Default: '06:00'
    Description: WFH auto-checkout time (IST HH:mm)

Conditions:
  EnableWarmup: !Equals [!Ref EnableWarmupSchedule, 'true']
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Resources:
  AttendanceApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # HTTP API v2 handles binary via Lambda isBase64Encoded (see server/src/lambda.js).
      # REST APIs need BinaryMediaTypes; this stack uses HttpApi, not AWS::Serverless::Api.
      CorsConfiguration:
        AllowCredentials: true
        AllowOrigins:
          - !Ref ClientOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
          - Cookie
          - X-CSRF-Token
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        MaxAge: 600

  AttendanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref ApiFunctionName
      Handler: server/src/lambda.handler
      CodeUri: lambda-package/
      ReservedConcurrentExecutions: !If
        - HasReservedConcurrency
        - !Ref ReservedConcurrency
        - !Ref AWS::NoValue
      Environment:
        Variables:
          NODE_ENV: production
          MONGODB_URI: !Ref MongoDbUri
          JWT_SECRET: !Ref JwtSecret
          JWT_EXPIRES_IN: !Ref JwtExpiresIn
          JWT_COOKIE_MAX_AGE_MS: !Ref JwtCookieMaxAgeMs
          CLIENT_ORIGIN: !Ref ClientOrigin
          UPLOADS_BUCKET: !Ref HelpUploadsBucketName
          UPLOADS_PREFIX: help-tickets
          UPLOAD_MAX_BYTES: '5242880'
          SMTP_HOST: !Ref SmtpHost
          SMTP_PORT: !Ref SmtpPort
          SMTP_SECURE: !Ref SmtpSecure
          SMTP_USER: !Ref SmtpUser
          SMTP_PASS: !Ref SmtpPass
          EMAIL_FROM: !Ref EmailFrom
          EMAIL_FROM_NAME: !Ref EmailFromName
          BREVO_API_KEY: !Ref BrevoApiKey
          SMS_SENDER: !Ref SmsSender
          SMS_DEFAULT_COUNTRY_CODE: !Ref SmsDefaultCountryCode
          LEAVE_DECISION_UNDO_MS: !Ref LeaveDecisionUndoMs
          AUTO_CHECKOUT_ENABLED: !Ref AutoCheckoutEnabled
          AUTO_CHECKOUT_OFFICE_DAY: !Ref AutoCheckoutOfficeDay
          AUTO_CHECKOUT_OFFICE_TIME: !Ref AutoCheckoutOfficeTime
          AUTO_CHECKOUT_WFH_DAY: !Ref AutoCheckoutWfhDay
          AUTO_CHECKOUT_WFH_TIME: !Ref AutoCheckoutWfhTime
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
                - s3:HeadObject
              Resource: !Sub 'arn:aws:s3:::${HelpUploadsBucketName}/help-tickets/*'
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            PayloadFormatVersion: '2.0'
            Method: ANY
            Path: /{proxy+}
        RootApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            PayloadFormatVersion: '2.0'
            Method: ANY
            Path: /

  WarmupScheduleRule:
    Type: AWS::Events::Rule
    Condition: EnableWarmup
    Properties:
      Description: Keep Lambda warm and prevent M0 auto-pause (lightweight /api/health ping)
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt AttendanceFunction.Arn
          Id: WarmupTarget
          Input: '{"version":"2.0","routeKey":"GET /api/health","rawPath":"/api/health","headers":{},"requestContext":{"http":{"method":"GET","path":"/api/health"}}}'

  WarmupSchedulePermission:
    Type: AWS::Lambda::Permission
    Condition: EnableWarmup
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AttendanceFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WarmupScheduleRule.Arn

  JobFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref JobFunctionName
      Handler: server/src/jobs/lambdaJobHandler.handler
      CodeUri: lambda-package/
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          NODE_ENV: production
          MONGODB_URI: !Ref MongoDbUri
          JWT_SECRET: !Ref JwtSecret
          CLIENT_ORIGIN: !Ref ClientOrigin
          UPLOADS_BUCKET: !Ref HelpUploadsBucketName
          UPLOADS_PREFIX: help-tickets
          SMTP_HOST: !Ref SmtpHost
          SMTP_PORT: !Ref SmtpPort
          SMTP_SECURE: !Ref SmtpSecure
          SMTP_USER: !Ref SmtpUser
          SMTP_PASS: !Ref SmtpPass
          EMAIL_FROM: !Ref EmailFrom
          EMAIL_FROM_NAME: !Ref EmailFromName
          BREVO_API_KEY: !Ref BrevoApiKey
          SMS_SENDER: !Ref SmsSender
          SMS_DEFAULT_COUNTRY_CODE: !Ref SmsDefaultCountryCode
          LEAVE_DECISION_UNDO_MS: !Ref LeaveDecisionUndoMs
          AUTO_CHECKOUT_ENABLED: !Ref AutoCheckoutEnabled
          AUTO_CHECKOUT_OFFICE_DAY: !Ref AutoCheckoutOfficeDay
          AUTO_CHECKOUT_OFFICE_TIME: !Ref AutoCheckoutOfficeTime
          AUTO_CHECKOUT_WFH_DAY: !Ref AutoCheckoutWfhDay
          AUTO_CHECKOUT_WFH_TIME: !Ref AutoCheckoutWfhTime
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:HeadObject
                - s3:DeleteObject
              Resource: !Sub 'arn:aws:s3:::${HelpUploadsBucketName}/help-tickets/*'

  AutoCheckoutScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Run auto-checkout job every 15 minutes
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt JobFunction.Arn
          Id: AutoCheckoutTarget
          Input: '{"jobName":"auto-checkout"}'

  LeaveNotifyScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Finalize leave decisions and send applicant mail shortly after the 15s undo window
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Arn: !GetAtt JobFunction.Arn
          Id: LeaveNotifyTarget
          Input: '{"jobName":"leave-decision-notify"}'

  AutoCheckoutSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref JobFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AutoCheckoutScheduleRule.Arn

  LeaveNotifySchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref JobFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LeaveNotifyScheduleRule.Arn

  HelpCleanupScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Delete orphaned pending help attachments (S3 + DB) daily
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Arn: !GetAtt JobFunction.Arn
          Id: HelpCleanupTarget
          Input: '{"jobName":"help-attachment-cleanup"}'

  HelpCleanupSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref JobFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HelpCleanupScheduleRule.Arn

  JobFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${JobFunctionName}-errors'
      AlarmDescription: Job Lambda errors >= 3 in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref JobFunctionName

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ApiFunctionName}-errors'
      AlarmDescription: Lambda errors >= 5 in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunctionName

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ApiFunctionName}-throttles'
      AlarmDescription: Lambda throttles >= 1 in 5 minutes (concurrency cap hit)
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunctionName

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ApiFunctionName}-duration'
      AlarmDescription: Lambda average duration > 10s in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Duration
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunctionName

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${AttendanceApi}.execute-api.${AWS::Region}.amazonaws.com'
