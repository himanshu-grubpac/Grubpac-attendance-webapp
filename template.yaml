AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Grubpac Attendance API (Express on Lambda + HTTP API)

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: nodejs20.x
    Architectures:
      - x86_64

Parameters:
  MongoDbUri:
    Type: String
    NoEcho: true
    Description: MongoDB Atlas connection string
  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret (32+ characters)
  ClientOrigin:
    Type: String
    Default: https://localhost
    Description: Frontend origin for CORS (CloudFront URL later)
  ApiFunctionName:
    Type: String
    Default: grubpac-attendance-api
    Description: Lambda function name (use grubpac-attendance-api-staging for staging)
  HelpUploadsBucketName:
    Type: String
    Description: Existing S3 bucket for help ticket attachments (created outside SAM)
  ReservedConcurrency:
    Type: Number
    Default: 40
    MinValue: 0
    MaxValue: 100
    Description: Max concurrent Lambda containers (0 = disabled). Prod 50-60 employees ~40. Staging use 0. If deploy fails on unreserved minimum, set 0 until AWS raises account concurrency limit.
  EnableWarmupSchedule:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: EventBridge ping every 5 min to keep containers warm
  JobFunctionName:
    Type: String
    Default: grubpac-attendance-api-jobs
    Description: Lambda function name for scheduled background jobs (auto-checkout, leave notify)

Conditions:
  EnableWarmup: !Equals [!Ref EnableWarmupSchedule, 'true']
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Resources:
  AttendanceApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # HTTP API v2 handles binary via Lambda isBase64Encoded (see server/src/lambda.js).
      # REST APIs need BinaryMediaTypes; this stack uses HttpApi, not AWS::Serverless::Api.
      CorsConfiguration:
        AllowCredentials: true
        AllowOrigins:
          - !Ref ClientOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
          - Cookie
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        MaxAge: 600

  AttendanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref ApiFunctionName
      Handler: server/src/lambda.handler
      CodeUri: lambda-package/
      ReservedConcurrentExecutions: !If
        - HasReservedConcurrency
        - !Ref ReservedConcurrency
        - !Ref AWS::NoValue
      Environment:
        Variables:
          NODE_ENV: production
          MONGODB_URI: !Ref MongoDbUri
          JWT_SECRET: !Ref JwtSecret
          JWT_EXPIRES_IN: 12h
          CLIENT_ORIGIN: !Ref ClientOrigin
          UPLOADS_BUCKET: !Ref HelpUploadsBucketName
          UPLOADS_PREFIX: help-tickets
          UPLOAD_MAX_BYTES: '5242880'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
                - s3:HeadObject
              Resource: !Sub 'arn:aws:s3:::${HelpUploadsBucketName}/help-tickets/*'
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            PayloadFormatVersion: '2.0'
            Method: ANY
            Path: /{proxy+}
        RootApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            PayloadFormatVersion: '2.0'
            Method: ANY
            Path: /

  WarmupScheduleRule:
    Type: AWS::Events::Rule
    Condition: EnableWarmup
    Properties:
      Description: Keep Lambda warm and prevent M0 auto-pause (lightweight /api/health ping)
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt AttendanceFunction.Arn
          Id: WarmupTarget
          Input: '{"version":"2.0","routeKey":"GET /api/health","rawPath":"/api/health","headers":{},"requestContext":{"http":{"method":"GET","path":"/api/health"}}}'

  WarmupSchedulePermission:
    Type: AWS::Lambda::Permission
    Condition: EnableWarmup
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AttendanceFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WarmupScheduleRule.Arn

  JobFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref JobFunctionName
      Handler: server/src/jobs/lambdaJobHandler.handler
      CodeUri: lambda-package/
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          NODE_ENV: production
          MONGODB_URI: !Ref MongoDbUri
          JWT_SECRET: !Ref JwtSecret
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'

  AutoCheckoutScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Run auto-checkout job every 15 minutes
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt JobFunction.Arn
          Id: AutoCheckoutTarget
          Input: '{"jobName":"auto-checkout"}'

  LeaveNotifyScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Run leave decision notify job every 30 minutes
      ScheduleExpression: rate(30 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt JobFunction.Arn
          Id: LeaveNotifyTarget
          Input: '{"jobName":"leave-decision-notify"}'

  AutoCheckoutSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref JobFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AutoCheckoutScheduleRule.Arn

  LeaveNotifySchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref JobFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LeaveNotifyScheduleRule.Arn

  JobFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${JobFunctionName}-errors'
      AlarmDescription: Job Lambda errors >= 3 in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref JobFunctionName

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ApiFunctionName}-errors'
      AlarmDescription: Lambda errors >= 5 in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunctionName

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ApiFunctionName}-throttles'
      AlarmDescription: Lambda throttles >= 1 in 5 minutes (concurrency cap hit)
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunctionName

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ApiFunctionName}-duration'
      AlarmDescription: Lambda average duration > 10s in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Duration
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunctionName

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${AttendanceApi}.execute-api.${AWS::Region}.amazonaws.com'
